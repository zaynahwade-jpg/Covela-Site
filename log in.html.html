<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — Covela</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <!-- Include your nav bar here -->
<nav class="nav" aria-label="Main">
    <div class="logo">
      <img src="/assets/img/logo-atom.png" alt="Covela atom logo">
      Covela
    </div>
    <div class="navlinks">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="schedule.html">Calendar</a>
      <a href="resources/index.html">Material</a>
      <a href="tutors.html">Tutors</a>
    </div>
    <div class="cta">
      <a class="button ghost" href="tutors.html">Tutors</a>
      <a class="button primary" href="signup.html">Sign Up</a>
    </div>
  </nav>
  <main class="main">
    <h1>Login</h1>
    <form id="login-form">
      <label>Email</label>
      <input type="email" id="login-email" required>

      <label>Password</label>
      <input type="password" id="login-password" required>

      <button type="submit" class="button primary">Log In</button>
    </form>
  </main>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
  <script>
    // Replace with your Firebase project config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Handle login
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      auth.signInWithEmailAndPassword(email, password)
        .then(userCredential => {
          alert("Welcome back, " + userCredential.user.email);
          // Redirect to dashboard
          window.location.href = "dashboard.html";
        })
        .catch(error => {
          alert(error.message);
        });
    });
  </script>
</body>
</html>
