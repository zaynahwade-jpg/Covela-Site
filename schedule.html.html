<!doctype html><html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Covela — Science Starts Here</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script defer src="assets/js/app.js"></script>
</head>
<body>
  <header class="header">
    <nav class="nav" aria-label="Main">
      <a href="index.html" class="logo">
  <img src="assets/img/logo-atom.png" alt="Covela logo">
Covela </a>
      <div class="menu-icon" onclick="toggleMenu()">☰</div>
<ul class="nav-links" id="navLinks">

</ul>
      <div class="navlinks">
        <a href="index.html">Home</a>
        <a href="dashboard.html.html">Dashboard</a>
        <a href="schedule.html.html">Calendar</a>
        <a href="resources/index.html">Material</a>
        <a href="tutors.html">Tutors</a>
      </div>
      <div id="roleCTA"></div>
    </nav>
  </header>
  <main class="main">
  <section class="schedule">
    <h1 class="page-title">Covela Schedule</h1>
    <p class="subtitle">Stay organized with upcoming study events and workshops</p>

    <!-- Calendar Grid -->
    <div id="calendar" class="calendar-grid"></div>

    <!-- Event List -->
    <h2 class="section-title">Available Events</h2>
    <ul id="event-list" class="event-list">
      <li>
        <span>🔬 Lab Safety Workshop — Dec 20</span>
        <button onclick="addEvent(20, 'Lab Safety Workshop')">Add</button>
      </li>
      <li>
        <span>🌌 Astronomy Night — Dec 22</span>
        <button onclick="addEvent(22, 'Astronomy Night')">Add</button>
      </li>
      <li>
        <span>🧪 Chemistry Demo — Dec 23</span>
        <button onclick="addEvent(23, 'Chemistry Demo')">Add</button>
      </li>
    </ul>
  </section>
</main>
<script>
const user = JSON.parse(localStorage.getItem("user"));
const cta = document.getElementById("roleCTA");

if (!user) {
  cta.innerHTML = `<a class="button nav" href="signin.html">Sign In</a>`;
} else if (user.role === "tutor") {
  cta.innerHTML = `<a class="button nav" href="create-session.html">Create Session</a>`;
} else {
  cta.innerHTML = ``;
}
</script>
 <div id="sessionList"></div> 
 <script>
const sessions = JSON.parse(localStorage.getItem("sessions")) || [];
const container = document.getElementById("sessionList");

sessions.forEach(session => {
  const card = document.createElement("div");
  card.classList.add("session-card");

  card.innerHTML = `
    <h3>${session.title}</h3>
    <p><strong>Date:</strong> ${session.date}</p>
    <p><strong>Time:</strong> ${session.time}</p>
    <p><strong>Tutor:</strong> ${session.tutor}</p>
    <p>${session.description}</p>
  `;

  // ⭐ ADD THIS — nothing else changes
  if (session.link) {
    card.innerHTML += `
      <p><a href="${session.link}" target="_blank">Join Meeting</a></p>
    `;
  }

  container.appendChild(card);
});
</script>
</body>
</html>
