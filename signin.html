<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Covela — Sign In</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

<script>
// Redirect if already signed in
const existingUser = localStorage.getItem("user");
if (existingUser) window.location.href = "dashboard.html";
</script>

<main class="auth-container">
  <form id="signinForm" class="auth-card">
    <h2>Sign In</h2>

    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>

    <label class="checkbox-row">
      <input type="checkbox" id="keepSignedIn">
      Keep me signed in
    </label>

    <button type="submit" class="submit button">Sign In</button>

    <p class="auth-switch">
      Don’t have an account?
      <a href="signup.html">Create one</a>
    </p>
  </form>
</main>

<script>
document.getElementById("signinForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const username = document.getElementById("username").value.trim();

  // Presentation mock logic:
  // If username contains "tutor", sign in as tutor
  let role = username.toLowerCase().includes("tutor") ? "tutor" : "student";

  const user = { username, role };

  localStorage.setItem("user", JSON.stringify(user));

  window.location.href = "dashboard.html";
});
</script>
</body>
</html>
