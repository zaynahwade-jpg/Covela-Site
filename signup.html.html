<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Covela — Create Account</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

<main class="auth-container">
  <div class="auth-card">
    <h2>Create Account</h2>

    <p>Select your role:</p>

    <div class="role-buttons">
      <button onclick="chooseRole('student')" class="button primary">Student</button>
      <button onclick="chooseRole('tutor')" class="button secondary">Tutor</button>
    </div>

    <div id="formContainer"></div>

    <p class="auth-switch">
      Already have an account?
      <a href="signin.html">Sign In</a>
    </p>
  </div>
</main>

<script>
function chooseRole(role) {
  if (role === "student") {
    document.getElementById("formContainer").innerHTML = `
      <form id="studentForm">
        <input type="text" id="sname" placeholder="Full Name" required>
        <input type="date" id="sdob" required>
        <input type="email" id="semail" placeholder="Email" required>
        <input type="password" id="spassword" placeholder="Password" required>
        <button type="submit" class="button primary">Create Account</button>
      </form>
    `;

    document.getElementById("studentForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const user = {
        username: document.getElementById("sname").value.trim(),
        role: "student"
      };

      localStorage.setItem("user", JSON.stringify(user));
      window.location.href = "dashboard.html";
    });

  } else {
    window.location.href = "tutor-application.html";
  }
}
</script>

</body>
</html>
