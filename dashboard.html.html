<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Covela — Dashboard</title>
  
  <!-- Link to main CSS (absolute path) -->
  <link rel="stylesheet" href="assets/css/styles.css">
  
</head>
<body>

  <!-- ---------- Header / Navbar ---------- -->
  <header class="header">
    <nav class="nav" aria-label="Main">
      <div class="logo">
        <img src="assets/img/logo-atom.png" alt="Covela logo">
        Covela
      </div>
      <div class="menu-icon" onclick="toggleMenu()">☰</div>
<ul class="nav-links" id="navLinks">
  <!-- your links here -->
</ul>
      <div class="navlinks">
        <a href="index.html">Home</a>
        <a href="dashboard.html.html" class="active">Dashboard</a>
        <a href="schedule.html.html">Calendar</a>
        <a href="resources/index.html">Material</a>
        <a href="tutors.html">Tutors</a>
      </div>
      <div class="cta">
        <a class="button nav" href="/signup.html.html">Sign Up</a>
      </div>
    </nav>
  </header>

  <!-- ---------- Dashboard Main Content ---------- -->
  <main class="dashboard">

    <!-- Welcome Section -->
    <section class="welcome">
      <h1>Welcome back, Zaynah 👋</h1>
      <p>Ready to keep learning?</p>
    </section>

    <!-- Cards Section -->
    <section class="cards">
      <div class="card practice">
        <h2>Continue Practicing</h2>
        <button class="button primary">Continue Lesson</button>
      </div>
      <div class="card streak">
        <h2>12-Day Streak</h2>
        <p>Keep it up!</p>
      </div>
      <div class="card hours">
        <h2>Study Hours</h2>
        <p>42.5 hours</p>
      </div>
    </section>

    <!-- Upcoming Sessions Table -->
    <section class="sessions">
      <h2>Upcoming Sessions</h2>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Tutor</th>
            <th>Subject</th>
            <th>Duration</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Nov 21</td>
            <td>Sarah T.</td>
            <td>Chemistry</td>
            <td>45 min</td>
            <td><button class="button ghost">View</button></td>
          </tr>
        </tbody>
      </table>
    </section>

  </main>

  <!-- Optional Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        console.log("User logged in:", user.email);
      }
    });
  </script>

</body>
</html>
